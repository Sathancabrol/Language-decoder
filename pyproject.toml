[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "language-decoder"
version = "0.1.0"
description = "Moteur de décodage de l'humain : physique, mental, capacité d'action et fonctionnement, avec provenance et garde-fou épistémique."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
keywords = ["cognitive", "ontology", "icf", "rdoc", "human", "decoder", "evidence"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Cognitive Science",
    "License :: OSI Approved :: Creative Commons Attribution 4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["language_decoder*"]

[tool.setuptools.package-data]
language_decoder = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
