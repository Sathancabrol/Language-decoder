<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Cognitorium Representation Engine — interface de visualisation live, chrome issu des illustrations Cognitorium.">
  <title>Cognitorium — Representation Engine</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%2322d3ee' stroke-width='2'/%3E%3Cpath d='M10 16h3l2-5 3 10 2-5h2' fill='none' stroke='%2322d3ee' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#stage">Aller à la scène</a>
  <div class="app">
    <aside class="side">
      <div class="logo">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 16h3l2-5 3 10 2-5h2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <div>
          <strong>COGNITORIUM</strong>
          <b>Representation</b>
        </div>
      </div>
      <nav aria-label="Vues">
        <button type="button" data-view="accueil">Accueil<small>Anneaux · synthèse</small></button>
        <button type="button" data-view="cognition">Cognition<small>Langages · construits</small></button>
        <button type="button" data-view="univers" aria-current="page">Univers<small>Constellation live</small></button>
        <button type="button" data-view="signaux">Signaux<small>Features · pas de brut</small></button>
        <button type="button" data-view="temps">Temps<small>Fan chart · T0</small></button>
      </nav>
      <div class="side-foot">
        <div class="layers" role="group" aria-label="Couches HCSM">
          <button type="button" data-layer="K" aria-pressed="true">K</button>
          <button type="button" data-layer="E" aria-pressed="true">E</button>
          <button type="button" data-layer="I" aria-pressed="true">I</button>
        </div>
        <p>v0.3 · local · simulé<br><a href="docs/outil-visualisation.md">doc</a> · pas un générateur de code</p>
      </div>
    </aside>

    <header class="top">
      <div>
        <h1 id="view-title">Univers</h1>
        <p class="sub" id="view-sub">Constellation knowledge · evidence · inference</p>
      </div>
      <label class="search"><span class="sr">Filtrer</span><input id="q" type="search" placeholder="Filtrer un nœud…"></label>
      <div class="live" id="live" data-on="true"><i></i> LIVE</div>
      <div class="clock" id="clock">T0 + 00:00</div>
      <button type="button" class="primary" id="btn-play" aria-pressed="true">Pause</button>
    </header>

    <main class="stage" id="stage">
      <section class="view" data-panel="accueil" hidden>
        <div class="dash">
          <div class="glass ring-card" id="ring-cov"></div>
          <div class="glass ring-card" id="ring-conf"></div>
          <div class="glass dash-graph">
            <svg id="graph-mini" viewBox="0 0 640 280" role="img" aria-label="Mini constellation"></svg>
          </div>
          <div class="cards" id="est-cards"></div>
        </div>
      </section>
      <section class="view" data-panel="cognition" hidden>
        <div class="cog-grid">
          <div class="glass" id="cog-body"></div>
          <div class="glass" id="cog-list"></div>
        </div>
      </section>
      <section class="view" data-panel="univers">
        <svg class="sky" id="graph" viewBox="0 0 1100 640" role="img" aria-label="Constellation live"></svg>
        <div class="tip" id="tip" hidden></div>
      </section>
      <section class="view" data-panel="signaux" hidden>
        <div class="wave-grid big" id="waves-big"></div>
      </section>
      <section class="view" data-panel="temps" hidden>
        <div class="glass fan-full">
          <h3 id="fan-title-full">Charge cognitive · incertitude dans le temps</h3>
          <svg id="fan-full" viewBox="0 0 1000 280" role="img" aria-label="Fan chart"></svg>
          <input type="range" id="scrub-full" min="0" max="0" value="0" aria-label="Parcourir le temps">
        </div>
      </section>
    </main>

    <aside class="insp">
      <div id="insp-est"></div>
      <div id="insp-langs"></div>
      <div id="insp-body"></div>
      <div id="insp-json"></div>
    </aside>

    <footer class="strip">
      <div class="waves">
        <h3>Signaux</h3>
        <div class="wave-grid" id="waves"></div>
      </div>
      <div class="fanbox">
        <h3 id="fan-title">Fan chart</h3>
        <svg id="fan" viewBox="0 0 520 150" role="img" aria-label="Incertitude temporelle"></svg>
      </div>
      <div class="scrub-wrap">
        <input type="range" id="scrub" min="0" max="0" value="0" aria-label="Temps">
        <span id="ctx">sim-001 · bureau</span>
      </div>
    </footer>
  </div>
  <script src="js/dashboard.js"></script>
</body>
</html>
